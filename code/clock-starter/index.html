<!DOCTYPE html>
<html>
<head>
<title>Clock</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 15vw;
  }
</style>
</head>
<body>

  <div id="clock"></div>

<script>
  const clock = document.getElementById("clock");

  // Show the current time and change the style
  function updateClock() {
    const now = new Date();
    const hours = now.getHours();      // 0–23
    const minutes = now.getMinutes();  // 0–59
    const seconds = now.getSeconds();  // 0–59

    clock.textContent = `${hours}:${minutes}:${seconds}`;

    if (seconds < 12) {
      document.body.style.fontFamily = "Arial";
      document.body.style.backgroundColor = "yellow";
      document.body.style.color = "black";
    } else if (seconds < 24) {
      document.body.style.fontFamily = "Times";
      document.body.style.backgroundColor = "black";
      document.body.style.color = "white";
    } else if (seconds < 36) {
      document.body.style.fontFamily = "Courier";
      document.body.style.backgroundColor = "tomato";
      document.body.style.color = "yellow";
    } else if (seconds < 48) {
      document.body.style.fontFamily = "Georgia";
      document.body.style.backgroundColor = "white";
      document.body.style.color = "red";
    } else {
      document.body.style.fontFamily = "Impact";
      document.body.style.backgroundColor = "royalblue";
      document.body.style.color = "white";
    }
  }

  updateClock();                    // show the time right away
  setInterval(updateClock, 1000);   // then check again every second
</script>

</body>
</html>
